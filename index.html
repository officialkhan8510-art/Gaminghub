<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Panda Login</title>

<style>
*{
  padding: 0;
  margin: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

body {
  background-color: #59cd49;
}

.container {
  height: 31.25em;
  width: 31.25em;
  position: absolute;
  transform: translate(-50%, -50%);
  top: 50%;
  left: 50%;
}

form {
  width: 23.75em;
  height: 18.75em;
  background-color: #ffffff;
  position: absolute;
  transform: translate(-50%, -50%);
  top: calc(50% + 3.1em);
  left: 50%;
  padding: 0 3.1em;
  display: flex;
  flex-direction: column;
  justify-content: center;
  border-radius: 0.5em;
}

form label {
  display: block;
  margin-bottom: 0.2em;
  font-weight: 600;
}

form input {
  font-size: 0.95em;
  padding: 0.3em;
  border: none;
  border-bottom: 0.12em solid #3f3554;
  outline: none;
}

form button {
  margin-top: 0.8em;
  padding: 0.8em;
  border: none;
  border-radius: 2em;
  background: #59cd49;
  cursor: pointer;
  font-weight: 600;
}

/* panda */
.panda-face {
  height: 7.5em;
  width: 8.4em;
  background: #fff;
  border: 0.18em solid #2e0d30;
  border-radius: 50%;
  position: absolute;
  top: 2em;
  left: 50%;
  transform: translateX(-50%);
}

.eye-l, .eye-r {
  position: absolute;
  height: 2em;
  width: 2em;
  background: #3f3554;
  border-radius: 50%;
  top: 2em;
}

.eye-l { left: 1.5em; }
.eye-r { right: 1.5em; }

.eyeball-l, .eyeball-r {
  position: absolute;
  height: 0.6em;
  width: 0.6em;
  background: #fff;
  border-radius: 50%;
  left: 0.6em;
  top: 0.6em;
  transition: 0.5s;
}

.hand-l, .hand-r {
  position: absolute;
  height: 2.8em;
  width: 2.5em;
  background: #3f3554;
  top: 8.4em;
  transition: 0.5s;
}

.hand-l { left: 7.5em; }
.hand-r { right: 7.5em; }

</style>
</head>

<body>

<div class="container">

  <div class="panda-face">
    <div class="eye-l"><div class="eyeball-l"></div></div>
    <div class="eye-r"><div class="eyeball-r"></div></div>
  </div>

  <form>
    <label>Username</label>
    <input id="username" type="text"/>

    <label>Password</label>
    <input id="password" type="password"/>

    <button type="button">Login</button>
  </form>

  <div class="hand-l"></div>
  <div class="hand-r"></div>

</div>

<script>
let usernameRef = document.getElementById("username");
let passwordRef = document.getElementById("password");
let eyeL = document.querySelector(".eyeball-l");
let eyeR = document.querySelector(".eyeball-r");
let handL = document.querySelector(".hand-l");
let handR = document.querySelector(".hand-r");

function normalEyeStyle(){
  eyeL.style.left = "0.6em";
  eyeL.style.top = "0.6em";
  eyeR.style.right = "0.6em";
  eyeR.style.top = "0.6em";
}

function normalHandStyle(){
  handL.style.height = "2.8em";
  handL.style.top = "8.4em";
  handL.style.left = "7.5em";
  handL.style.transform = "rotate(0deg)";

  handR.style.height = "2.8em";
  handR.style.top = "8.4em";
  handR.style.right = "7.5em";
  handR.style.transform = "rotate(0deg)";
}

usernameRef.addEventListener("focus", () => {
  eyeL.style.top = "1.2em";
  eyeR.style.top = "1.2em";
  normalHandStyle();
});

passwordRef.addEventListener("focus", () => {
  handL.style.height = "6em";
  handL.style.transform = "rotate(-155deg)";
  handL.style.top = "3.8em";
  handL.style.left = "11em";

  handR.style.height = "6em";
  handR.style.transform = "rotate(155deg)";
  handR.style.top = "3.8em";
  handR.style.right = "11em";

  normalEyeStyle();
});

document.addEventListener("click", (e) => {
  if(e.target !== usernameRef && e.target !== passwordRef){
    normalEyeStyle();
    normalHandStyle();
  }
});
</script>

</body>
</html>
