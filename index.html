<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Panda Login</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: radial-gradient(circle, #7CFF6B, #2e7d32);
  font-family: Arial;
}

.container{
  position:relative;
}

/* ===== 3D EFFECT BASE ===== */
.panda{
  width:180px;
  height:180px;
  position:absolute;
  top:-140px;
  left:50%;
  transform:translateX(-50%);
  transform-style:preserve-3d;
  animation: float 3s ease-in-out infinite;
}

@keyframes float{
  0%,100%{ transform:translateX(-50%) translateY(0px);}
  50%{ transform:translateX(-50%) translateY(-10px);}
}

.face{
  width:100%;
  height:100%;
  background: linear-gradient(145deg,#fff,#dcdcdc);
  border-radius:50%;
  box-shadow:
    inset -8px -8px 15px rgba(0,0,0,0.2),
    10px 10px 25px rgba(0,0,0,0.3);
  position:relative;
}

/* ears */
.ear{
  width:50px;
  height:50px;
  background:#2b2b2b;
  border-radius:50%;
  position:absolute;
  top:-20px;
  box-shadow: inset -5px -5px 10px rgba(0,0,0,0.5);
}
.ear.left{ left:10px; }
.ear.right{ right:10px; }

/* eyes */
.eye{
  width:35px;
  height:45px;
  background:#2b2b2b;
  border-radius:50%;
  position:absolute;
  top:55px;
  box-shadow: inset -3px -3px 6px rgba(0,0,0,0.5);
}
.eye.left{ left:35px; transform:rotate(-10deg);}
.eye.right{ right:35px; transform:rotate(10deg); }

.eye span{
  width:10px;
  height:10px;
  background:#fff;
  border-radius:50%;
  position:absolute;
  top:10px;
  left:10px;
}

/* nose */
.nose{
  width:18px;
  height:12px;
  background:#111;
  border-radius:50%;
  position:absolute;
  top:95px;
  left:50%;
  transform:translateX(-50%);
}

/* mouth */
.mouth{
  width:40px;
  height:20px;
  border-bottom:3px solid #111;
  border-radius:50%;
  position:absolute;
  top:110px;
  left:50%;
  transform:translateX(-50%);
}

/* form */
form{
  width:260px;
  padding:20px;
  background:#fff;
  border-radius:15px;
  box-shadow:0 20px 40px rgba(0,0,0,0.3);
}

input{
  width:100%;
  margin:10px 0;
  padding:10px;
  border:none;
  border-bottom:2px solid #2e7d32;
  outline:none;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:20px;
  background:#2e7d32;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}
button:hover{
  transform:scale(1.05);
}
</style>
</head>

<body>

<div class="container">

  <div class="panda">
    <div class="ear left"></div>
    <div class="ear right"></div>

    <div class="face">
      <div class="eye left"><span></span></div>
      <div class="eye right"><span></span></div>
      <div class="nose"></div>
      <div class="mouth"></div>
    </div>
  </div>

  <form id="loginForm">
    <input type="text" placeholder="Username" required />
    <input type="password" placeholder="Password" required />
    <button type="submit">LOGIN</button>
  </form>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e){
  e.preventDefault();
  window.location.href = "game.html";
});
</script>

</body>
</html>
